<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Block Blast Pro Max</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Crect x='25' y='25' width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Crect x='61' y='25' width='32' height='32' rx='8' fill='%23ec4899'/%3E%3Crect x='25' y='61' width='32' height='32' rx='8' fill='%2310b981'/%3E%3Crect x='65' y='58' width='32' height='32' rx='8' fill='%23f59e0b' transform='rotate(15 81 74)'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap");

      body {
        font-family: "Nunito", sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: white;
        touch-action: none;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }

      #app-container {
        position: relative;
        width: 100%;
        max-width: 500px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      :root {
        --board-size: 8;
      }

      .board-grid {
        display: grid;
        grid-template-columns: repeat(var(--board-size), 1fr);
        grid-template-rows: repeat(var(--board-size), 1fr);
        gap: 2px;
        background-color: #1e293b;
        padding: 4px;
        border-radius: 8px;
        width: 100%;
        aspect-ratio: 1 / 1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      .cell {
        background-color: #334155;
        border-radius: 4px;
        transition: all 0.15s ease-in-out;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(10px, 4vw, 24px); /* Dynamic gem size */
      }

      .cell-shadow {
        background-color: rgba(255, 255, 255, 0.2) !important;
        transform: scale(0.95);
      }

      @keyframes pulse-danger {
        0%,
        100% {
          background-color: rgba(239, 68, 68, 0.4);
          transform: scale(0.98);
        }
        50% {
          background-color: rgba(239, 68, 68, 0.8);
          transform: scale(1.02);
          box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }
      }

      .will-clear {
        animation: pulse-danger 0.6s infinite !important;
        z-index: 5;
      }

      /* CSS Animation Fix for text color glitch */
      @keyframes scorePop {
        0% {
          transform: scale(1);
          color: white;
        }
        50% {
          transform: scale(1.4);
          color: #a78bfa;
        }
        100% {
          transform: scale(1);
          color: white;
        }
      }

      .score-animate {
        animation: scorePop 0.2s ease-out;
      }

      .shape-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 120px;
        width: 100%;
        position: relative;
      }

      .shape-grid {
        display: grid;
        gap: 2px;
        cursor: grab;
        transition: transform 0.1s ease;
      }
      
      .shape-grid:active {
          cursor: grabbing;
      }

      .shape-cell {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
      }

      @media (min-width: 640px) {
        .shape-cell {
          width: 30px;
          height: 30px;
          font-size: 18px;
        }
      }

      .dragging {
        position: fixed;
        pointer-events: none;
        z-index: 50;
        opacity: 0.95;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
          filter: brightness(1.5);
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      .clearing {
        animation: pop 0.3s forwards;
        z-index: 10;
      }

      .shape-hidden {
        opacity: 0 !important;
        pointer-events: none;
      }

      .screen-overlay {
        position: absolute;
        inset: 0;
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 40;
        transition: opacity 0.3s;
        overflow-y: auto;
        padding: 20px;
      }

      .hidden-screen {
        display: none !important;
      }

      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app-container">
      <!-- MÀN HÌNH CHÍNH (MENU) -->
      <div id="main-menu" class="screen-overlay">
        <!-- LOGO -->
        <div
          class="relative w-40 h-40 mx-auto mb-2 mt-4 hover:scale-110 transition-transform duration-300"
        >
          <svg
            viewBox="0 0 120 120"
            xmlns="http://www.w3.org/2000/svg"
            class="w-full h-full drop-shadow-[0_10px_15px_rgba(0,0,0,0.8)] animate-bounce"
            style="animation-duration: 2.5s"
          >
            <defs>
              <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #60a5fa; stop-opacity: 1" />
                <stop offset="100%" style="stop-color: #2563eb; stop-opacity: 1" />
              </linearGradient>
              <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #f472b6; stop-opacity: 1" />
                <stop offset="100%" style="stop-color: #db2777; stop-opacity: 1" />
              </linearGradient>
              <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #34d399; stop-opacity: 1" />
                <stop offset="100%" style="stop-color: #059669; stop-opacity: 1" />
              </linearGradient>
              <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color: #fbbf24; stop-opacity: 1" />
                <stop offset="100%" style="stop-color: #ea580c; stop-opacity: 1" />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <ellipse cx="60" cy="112" rx="35" ry="6" fill="rgba(0,0,0,0.5)" />
            <rect x="25" y="25" width="32" height="32" rx="8" fill="url(#gradBlue)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#glow)" />
            <rect x="61" y="25" width="32" height="32" rx="8" fill="url(#gradPink)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#glow)" />
            <rect x="25" y="61" width="32" height="32" rx="8" fill="url(#gradGreen)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#glow)" />
            <g transform="translate(68, 56) rotate(15) scale(1.15)">
              <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#gradOrange)" stroke="rgba(255,255,255,0.8)" stroke-width="2" filter="url(#glow)" />
              <path d="M 4 8 Q 16 0 28 8" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round" />
              <path d="M 28 -6 L 30 0 L 36 2 L 30 4 L 28 10 L 26 4 L 20 2 L 26 0 Z" fill="#fef08a" />
            </g>
          </svg>
        </div>

        <h1 class="text-5xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 mb-2 text-center drop-shadow-lg animate-pulse mt-2">
          BLOCK BLAST
        </h1>
        <p class="text-slate-400 mb-8 text-lg tracking-widest font-bold">
          PRO MAX EDITION
        </p>

        <div class="w-full max-w-sm grid grid-cols-2 gap-3 mb-8">
          <button onclick="startGame('classic')" class="col-span-2 py-4 bg-gradient-to-r from-blue-600 to-blue-400 rounded-2xl font-black text-xl hover:scale-105 transition-all shadow-lg active:scale-95 border border-blue-300/30">
            🎮 CHƠI CỔ ĐIỂN
          </button>
          <button onclick="startGame('timed')" class="py-3 bg-gradient-to-br from-orange-600 to-red-500 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg active:scale-95 border border-red-300/30">
            ⏱️ Đua Giờ
          </button>
          <button onclick="startGame('level')" class="py-3 bg-gradient-to-br from-green-600 to-teal-500 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg active:scale-95 border border-green-300/30">
            ⭐ Vượt Ải
          </button>
          <button onclick="startGame('collect')" class="py-3 bg-gradient-to-br from-purple-600 to-pink-500 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg active:scale-95 border border-pink-300/30">
            💎 Thu Thập
          </button>
          <button onclick="openCustomSetup()" class="py-3 bg-gradient-to-br from-slate-600 to-gray-500 rounded-2xl font-bold text-lg hover:scale-105 transition-all shadow-lg active:scale-95 border border-gray-300/30">
            ⚙️ Tùy Chỉnh
          </button>
          <button onclick="showLeaderboard()" class="col-span-2 py-3 bg-slate-800 rounded-2xl font-bold text-lg hover:bg-slate-700 transition-all border border-slate-600 active:scale-95 mt-2 text-slate-300">
            🏆 BẢNG XẾP HẠNG
          </button>
        </div>
      </div>

      <div id="custom-setup-modal" class="hidden-screen screen-overlay bg-slate-900/95 backdrop-blur-md">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-600 shadow-2xl text-center">
          <h2 class="text-3xl font-black text-white mb-6">TÙY CHỈNH BẢNG</h2>
          <div class="mb-8">
            <label class="block text-slate-300 font-bold mb-4">Kích thước bàn cờ:
              <span id="custom-size-val" class="text-blue-400 text-2xl">8x8</span>
            </label>
            <input type="range" id="custom-size-slider" min="6" max="12" value="8" class="w-full accent-blue-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" />
            <div class="flex justify-between text-xs text-slate-500 mt-2 font-bold px-1">
              <span>6x6</span><span>12x12</span>
            </div>
          </div>
          <div class="flex gap-3">
            <button onclick="closeCustomSetup()" class="flex-1 py-3 bg-slate-700 rounded-xl font-bold text-white hover:bg-slate-600 transition-all">Hủy</button>
            <button onclick="startGame('custom')" class="flex-1 py-3 bg-blue-500 rounded-xl font-bold text-white hover:bg-blue-400 transition-all shadow-lg">Bắt Đầu</button>
          </div>
        </div>
      </div>

      <div id="leaderboard-screen" class="hidden-screen screen-overlay bg-slate-900/95 backdrop-blur-md">
        <div class="w-full max-w-sm bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl flex flex-col max-h-full">
          <h2 class="text-3xl font-black text-center text-white mb-6">🏆 XẾP HẠNG</h2>
          <div class="flex gap-2 mb-4 overflow-x-auto pb-2 shrink-0">
            <button onclick="renderLeaderboardTab('classic')" id="tab-classic" class="px-4 py-2 rounded-lg font-bold bg-blue-500 text-white whitespace-nowrap">Cổ Điển</button>
            <button onclick="renderLeaderboardTab('timed')" id="tab-timed" class="px-4 py-2 rounded-lg font-bold bg-slate-700 text-slate-300 whitespace-nowrap">Thời Gian</button>
            <button onclick="renderLeaderboardTab('level')" id="tab-level" class="px-4 py-2 rounded-lg font-bold bg-slate-700 text-slate-300 whitespace-nowrap">Vượt Ải</button>
          </div>
          <div id="leaderboard-list" class="space-y-2 mb-6 flex-grow overflow-y-auto"></div>
          <button onclick="closeLeaderboard()" class="w-full py-3 bg-slate-700 rounded-xl font-bold text-lg hover:bg-slate-600 transition-all text-white shrink-0">ĐÓNG</button>
        </div>
      </div>

      <div id="game-screen" class="hidden-screen flex-col h-full w-full p-4 relative">
        <header class="w-full flex justify-between items-end mb-4 pt-2">
          <div class="flex flex-col items-start gap-1">
            <button onclick="quitGame()" class="text-xs px-3 py-1.5 bg-slate-800/80 rounded-lg text-slate-300 mb-1 hover:text-white hover:bg-slate-700 transition-all border border-slate-600 backdrop-blur-sm">❮ Menu</button>

            <!-- Dynamic Status Area -->
            <div id="status-timer" class="hidden">
              <div class="text-[10px] text-orange-400 uppercase tracking-widest font-black">Thời gian</div>
              <div id="timer" class="text-2xl font-black text-white leading-none">03:00</div>
            </div>
            <div id="status-level" class="hidden">
              <div class="text-[10px] text-green-400 uppercase tracking-widest font-black" id="level-label">Level 1</div>
              <div class="text-lg font-black text-white leading-none flex items-center gap-1">Mục tiêu: <span id="level-target" class="text-green-300">200</span></div>
            </div>
            <div id="status-collect" class="hidden">
              <div class="text-[10px] text-purple-400 uppercase tracking-widest font-black" id="collect-label">Ải 1</div>
              <div class="text-lg font-black text-white leading-none flex items-center gap-1">💎 <span id="collect-progress">0/10</span></div>
            </div>
          </div>

          <div class="text-right">
            <div class="text-[10px] text-slate-400 uppercase tracking-widest font-black">Điểm số</div>
            <!-- Cập nhật thẻ hiển thị Điểm: Đảm bảo mặc định là text-white -->
            <div id="score" class="text-4xl font-black text-white leading-none transition-transform duration-150">0</div>
          </div>
        </header>

        <main class="w-full flex-grow flex flex-col justify-center relative">
          <div id="board" class="board-grid"></div>
          
          <div id="level-up-banner" class="absolute inset-0 flex justify-center items-center pointer-events-none opacity-0 transition-opacity duration-300 z-30">
            <div class="bg-gradient-to-r from-green-500 to-emerald-500 text-white font-black text-4xl px-8 py-4 rounded-2xl shadow-[0_0_40px_rgba(16,185,129,0.8)] transform scale-50 transition-transform duration-500" id="level-up-text">LEVEL UP!</div>
          </div>
        </main>

        <div class="text-center text-[10px] text-slate-400 font-bold tracking-widest uppercase mb-1 animate-pulse">
            Chạm vào khối để Xoay ↻
        </div>
        <footer class="w-full flex justify-between gap-2 pb-4" id="tray">
          <div class="shape-container" id="slot-0"></div>
          <div class="shape-container" id="slot-1"></div>
          <div class="shape-container" id="slot-2"></div>
        </footer>
      </div>

      <div id="game-over-modal" class="hidden fixed inset-0 bg-black/90 flex justify-center items-center z-50 backdrop-blur-md p-4">
        <div class="bg-slate-800 p-8 rounded-3xl text-center shadow-[0_0_40px_rgba(0,0,0,0.8)] border border-slate-600 max-w-sm w-full">
          <h2 id="game-over-title" class="text-4xl font-black text-red-500 mb-2 drop-shadow-md">HẾT NƯỚC ĐI!</h2>
          <p id="game-over-desc" class="text-slate-300 mb-6 font-semibold">Bạn không còn vị trí nào để đặt khối.</p>
          
          <div class="bg-slate-900 rounded-2xl p-6 mb-6 shadow-inner border border-slate-700 relative overflow-hidden">
            <div class="text-sm text-slate-400 font-bold tracking-widest uppercase mb-1 z-10 relative">Điểm của bạn</div>
            <div id="final-score" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-white to-slate-400 z-10 relative">0</div>
            <div id="high-score-badge" class="hidden mt-3 text-yellow-400 font-black animate-bounce text-sm uppercase tracking-widest bg-yellow-400/20 py-1 px-3 rounded-full inline-block z-10 relative border border-yellow-400/50">🌟 Kỷ lục mới! 🌟</div>
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-blue-500/10 z-0"></div>
          </div>

          <div class="space-y-3">
            <button onclick="restartCurrentMode()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl font-bold text-xl hover:scale-105 transition-transform shadow-lg active:scale-95 text-white">Chơi Lại Lần Nữa</button>
            <button onclick="quitGame()" class="w-full py-3 bg-slate-700 rounded-xl font-bold text-lg hover:bg-slate-600 transition-all text-white active:scale-95 border border-slate-600">Về Màn Hình Chính</button>
          </div>
        </div>
      </div>

      <div id="drag-container"></div>
    </div>

    <script>
      let BOARD_SIZE = 8;
      let score = 0;
      let boardState = [];
      let currentShapes = [null, null, null];
      let draggedData = null;

      let currentMode = "classic"; // 'classic', 'timed', 'level', 'collect', 'custom'

      let timeRemaining = 180;
      let timerInterval = null;

      let currentLevel = 1;
      let targetScore = 200;
      let collectedGems = 0;
      let targetGems = 10;
      let isTransitioningLevel = false;

      // Shape Library
      const SHAPE_LIBRARY = [
        { matrix: [[1]], color: "bg-yellow-400" },
        { matrix: [[1, 1]], color: "bg-green-400" },
        { matrix: [[1], [1]], color: "bg-green-400" },
        { matrix: [[1, 1, 1]], color: "bg-blue-400" },
        { matrix: [[1], [1], [1]], color: "bg-blue-400" },
        { matrix: [[1, 1, 1, 1]], color: "bg-indigo-400" },
        { matrix: [[1], [1], [1], [1]], color: "bg-indigo-400" },
        { matrix: [[1, 1, 1, 1, 1]], color: "bg-cyan-400" },
        { matrix: [[1], [1], [1], [1], [1]], color: "bg-cyan-400" },
        { matrix: [[1, 1], [1, 1]], color: "bg-red-400" },
        { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: "bg-pink-500" },
        { matrix: [[1, 1], [1, 0]], color: "bg-orange-400" },
        { matrix: [[1, 1], [0, 1]], color: "bg-orange-400" },
        { matrix: [[1, 0], [1, 1]], color: "bg-orange-400" },
        { matrix: [[0, 1], [1, 1]], color: "bg-orange-400" },
        { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: "bg-purple-500" },
        { matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]], color: "bg-purple-500" },
        { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], color: "bg-purple-500" },
        { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], color: "bg-purple-500" },
        { matrix: [[1, 1, 1], [0, 1, 0]], color: "bg-teal-400" },
        { matrix: [[0, 1, 0], [1, 1, 1]], color: "bg-teal-400" },
        { matrix: [[1, 0], [1, 1], [1, 0]], color: "bg-teal-400" },
        { matrix: [[0, 1], [1, 1], [0, 1]], color: "bg-teal-400" },
      ];

      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const dragContainer = document.getElementById("drag-container");
      const gameOverModal = document.getElementById("game-over-modal");

      const mainMenu = document.getElementById("main-menu");
      const gameScreen = document.getElementById("game-screen");
      const leaderboardScreen = document.getElementById("leaderboard-screen");
      const customSetupModal = document.getElementById("custom-setup-modal");
      const customSizeSlider = document.getElementById("custom-size-slider");
      const customSizeVal = document.getElementById("custom-size-val");

      const statusTimer = document.getElementById("status-timer");
      const timerEl = document.getElementById("timer");
      const statusLevel = document.getElementById("status-level");
      const levelLabel = document.getElementById("level-label");
      const levelTarget = document.getElementById("level-target");
      const statusCollect = document.getElementById("status-collect");
      const collectLabel = document.getElementById("collect-label");
      const collectProgress = document.getElementById("collect-progress");
      const levelUpBanner = document.getElementById("level-up-banner");
      const levelUpText = document.getElementById("level-up-text");

      customSizeSlider.addEventListener("input", (e) => {
        customSizeVal.innerText = `${e.target.value}x${e.target.value}`;
      });

      function openCustomSetup() {
        customSetupModal.classList.remove("hidden-screen");
      }

      function closeCustomSetup() {
        customSetupModal.classList.add("hidden-screen");
      }

      function getLeaderboardData() {
        const data = localStorage.getItem("blockBlastProLB");
        if (data) return JSON.parse(data);
        return { classic: [], timed: [], level: [] }; 
      }

      function saveScore(newScore, mode) {
        if (newScore === 0 || mode === "custom" || mode === "collect") return false;
        let data = getLeaderboardData();
        if (!data[mode]) data[mode] = [];
        let isHighScore = data[mode].length === 0 || newScore > data[mode][0];

        data[mode].push(newScore);
        data[mode] = data[mode].sort((a, b) => b - a).slice(0, 5);
        localStorage.setItem("blockBlastProLB", JSON.stringify(data));
        return isHighScore;
      }

      function showLeaderboard() {
        mainMenu.classList.add("hidden-screen");
        leaderboardScreen.classList.remove("hidden-screen");
        renderLeaderboardTab("classic");
      }

      function closeLeaderboard() {
        leaderboardScreen.classList.add("hidden-screen");
        mainMenu.classList.remove("hidden-screen");
      }

      function renderLeaderboardTab(mode) {
        const tabs = ["classic", "timed", "level"];
        tabs.forEach((t) => {
          const btn = document.getElementById(`tab-${t}`);
          if (t === mode) {
            btn.className = "px-4 py-2 rounded-lg font-bold bg-blue-500 text-white whitespace-nowrap shadow-lg scale-105 transition-all";
          } else {
            btn.className = "px-4 py-2 rounded-lg font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition-all whitespace-nowrap border border-slate-700";
          }
        });

        const data = getLeaderboardData();
        const scores = data[mode] || [];
        const list = document.getElementById("leaderboard-list");
        list.innerHTML = "";

        if (scores.length === 0) {
          list.innerHTML = '<div class="text-center text-slate-500 py-8 font-bold">Chưa có dữ liệu</div>';
          return;
        }

        scores.forEach((s, index) => {
          let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `<span class="text-slate-500 w-6 inline-block text-center text-sm">${index + 1}</span>`;
          const item = document.createElement("div");
          item.className = "flex justify-between items-center bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 shadow-inner";
          item.innerHTML = `<div class="text-xl font-bold flex items-center gap-3">${medal}</div><div class="text-2xl font-black text-white">${s}</div>`;
          list.appendChild(item);
        });
      }

      function startGame(mode) {
        currentMode = mode;
        if (mode === "custom") {
          BOARD_SIZE = parseInt(customSizeSlider.value);
          closeCustomSetup();
        } else {
          BOARD_SIZE = 8;
        }

        document.documentElement.style.setProperty("--board-size", BOARD_SIZE);
        mainMenu.classList.add("hidden-screen");
        gameScreen.classList.remove("hidden-screen");

        setupModeUI();
        resetGameState();
      }

      function setupModeUI() {
        statusTimer.classList.add("hidden");
        statusLevel.classList.add("hidden");
        statusCollect.classList.add("hidden");
        stopTimer();

        if (currentMode === "timed") {
          statusTimer.classList.remove("hidden");
          timeRemaining = 180;
          updateTimerDisplay();
          startTimer();
        } else if (currentMode === "level") {
          statusLevel.classList.remove("hidden");
          currentLevel = 1;
          targetScore = 200;
          updateLevelUI();
        } else if (currentMode === "collect") {
          statusCollect.classList.remove("hidden");
          currentLevel = 1;
          collectedGems = 0;
          targetGems = 10;
          updateLevelUI();
        }
      }

      function updateLevelUI() {
        if (currentMode === "level") {
          levelLabel.innerText = `LEVEL ${currentLevel}`;
          levelTarget.innerText = targetScore;
        } else if (currentMode === "collect") {
          collectLabel.innerText = `ẢI ${currentLevel}`;
          collectProgress.innerText = `${collectedGems}/${targetGems}`;
        }
      }

      function resetGameState() {
        score = 0;
        scoreEl.innerText = "0";
        // Đảm bảo xóa class animation cũ
        scoreEl.classList.remove("score-animate");
        isTransitioningLevel = false;

        boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
        currentShapes = [null, null, null];

        initBoard();
        generateShapes();
      }

      function quitGame() {
        stopTimer();
        gameScreen.classList.add("hidden-screen");
        gameOverModal.classList.add("hidden");
        mainMenu.classList.remove("hidden-screen");
      }

      function restartCurrentMode() {
        gameOverModal.classList.add("hidden");
        setupModeUI();
        resetGameState();
      }

      function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();

          if (timeRemaining <= 10 && timeRemaining > 0) {
            timerEl.classList.add("text-red-500", "animate-pulse");
          } else {
            timerEl.classList.remove("text-red-500", "animate-pulse");
          }

          if (timeRemaining <= 0) {
            stopTimer();
            triggerGameOver("HẾT GIỜ!", "Thời gian của bạn đã kết thúc.");
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        timerEl.classList.remove("text-red-500", "animate-pulse");
      }

      function updateTimerDisplay() {
        const m = Math.floor(timeRemaining / 60);
        const s = timeRemaining % 60;
        timerEl.innerText = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
      }

      function initBoard() {
        boardEl.innerHTML = "";
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.id = `cell-${r}-${c}`;
            boardEl.appendChild(cell);
          }
        }
        updateBoardVisuals();
      }

      function updateBoardVisuals() {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (!cell) continue;

            const data = boardState[r][c];
            if (data) {
              cell.className = `cell ${data.color}`;
              cell.innerHTML = data.gem ? "💎" : "";
            } else {
              cell.className = "cell";
              cell.innerHTML = "";
            }
          }
        }
      }

      function generateShapes() {
        let allEmpty = true;
        for (let i = 0; i < 3; i++) {
          if (currentShapes[i]) {
            allEmpty = false;
            break;
          }
        }

        if (allEmpty) {
          for (let i = 0; i < 3; i++) {
            const randomBase = SHAPE_LIBRARY[Math.floor(Math.random() * SHAPE_LIBRARY.length)];
            let shapeObj = {
              matrix: randomBase.matrix,
              color: randomBase.color,
              gems: [],
            };

            if (currentMode === "collect") {
              let solidCells = [];
              randomBase.matrix.forEach((row, r) => {
                row.forEach((val, c) => {
                  if (val === 1) solidCells.push({ r, c });
                });
              });
              if (solidCells.length > 0 && Math.random() < 0.35) {
                const pick = solidCells[Math.floor(Math.random() * solidCells.length)];
                shapeObj.gems.push(pick);
              }
            }

            currentShapes[i] = shapeObj;
            renderShapeInSlot(i, shapeObj);
          }
        }

        setTimeout(() => checkGameOverLogic(), 100);
      }

      function renderShapeInSlot(index, shapeObj) {
        const slot = document.getElementById(`slot-${index}`);
        slot.innerHTML = "";
        if (!shapeObj) return;

        const grid = document.createElement("div");
        grid.className = "shape-grid";
        grid.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, 1fr)`;

        shapeObj.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            const block = document.createElement("div");
            if (val === 1) {
              block.className = `shape-cell ${shapeObj.color}`;
              let hasGem = shapeObj.gems.some((g) => g.r === r && g.c === c);
              if (hasGem) block.innerHTML = "💎";
            } else {
              block.style.opacity = "0";
            }
            grid.appendChild(block);
          });
        });

        grid.addEventListener("pointerdown", (e) => {
          if (!isTransitioningLevel) handlePointerDown(e, index, shapeObj, grid);
        });
        slot.appendChild(grid);
      }

      // Rotate functionality
      function rotateShape(index) {
        let shapeObj = currentShapes[index];
        if (!shapeObj) return;

        const oldMatrix = shapeObj.matrix;
        const rows = oldMatrix.length;
        const cols = oldMatrix[0].length;

        let newMatrix = Array.from({ length: cols }, () => Array(rows).fill(0));
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                newMatrix[c][rows - 1 - r] = oldMatrix[r][c];
            }
        }

        let newGems = shapeObj.gems.map(g => ({
            r: g.c,
            c: rows - 1 - g.r
        }));

        shapeObj.matrix = newMatrix;
        shapeObj.gems = newGems;

        renderShapeInSlot(index, shapeObj);
        checkGameOverLogic(); // Re-check if valid move exists after rotation
      }

      function handlePointerDown(e, index, shapeObj, originalElement) {
        e.preventDefault();

        const cellWidth = boardEl.clientWidth / BOARD_SIZE;

        const clone = originalElement.cloneNode(true);
        clone.className = "shape-grid dragging";
        clone.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, ${cellWidth}px)`;

        Array.from(clone.children).forEach((child) => {
          child.style.width = `${cellWidth}px`;
          child.style.height = `${cellWidth}px`;
          if (child.innerHTML) child.style.fontSize = `${cellWidth * 0.6}px`;
        });

        dragContainer.appendChild(clone);
        originalElement.classList.add("shape-hidden");

        draggedData = {
          index,
          shapeObj,
          originalElement,
          clone,
          offsetX: (cellWidth * shapeObj.matrix[0].length) / 2,
          offsetY: (cellWidth * shapeObj.matrix.length) / 2,
          cellWidth,
          startX: e.clientX,
          startY: e.clientY
        };

        moveClone(e.clientX, e.clientY);

        document.addEventListener("pointermove", handlePointerMove);
        document.addEventListener("pointerup", handlePointerUp);
      }

      function moveClone(clientX, clientY) {
        if (!draggedData) return;
        const adjustY = window.innerWidth < 640 ? draggedData.cellWidth * 2.5 : 0;
        
        draggedData.clone.style.left = `${clientX - draggedData.offsetX}px`;
        draggedData.clone.style.top = `${clientY - draggedData.offsetY - adjustY}px`;
        
        // Prevent shadow updates if we barely moved (it might be a tap)
        const dist = Math.hypot(clientX - draggedData.startX, clientY - draggedData.startY);
        if (dist >= 5) {
            updateShadow(clientX, clientY - adjustY);
        }
      }

      function handlePointerMove(e) {
        e.preventDefault();
        moveClone(e.clientX, e.clientY);
      }

      function getGridCoordinates(clientX, clientY) {
        if (!draggedData) return { valid: false };

        const boardRect = boardEl.getBoundingClientRect();
        const cloneRect = draggedData.clone.getBoundingClientRect();
        const cellWidth = draggedData.cellWidth;

        const col = Math.round((cloneRect.left - boardRect.left) / cellWidth);
        const row = Math.round((cloneRect.top - boardRect.top) / cellWidth);

        return { row, col, valid: true };
      }

      function updateShadow(clientX, clientY) {
        clearShadows();
        const coords = getGridCoordinates(clientX, clientY);
        if (!coords.valid) return;

        const { row, col } = coords;
        const matrix = draggedData.shapeObj.matrix;

        if (canPlaceShape(matrix, row, col)) {
          matrix.forEach((rArr, r) => {
            rArr.forEach((val, c) => {
              if (val === 1) {
                const cell = document.getElementById(`cell-${row + r}-${col + c}`);
                if (cell) cell.classList.add("cell-shadow");
              }
            });
          });
          predictDestruction(matrix, row, col);
        }
      }

      function predictDestruction(matrix, row, col) {
        let virtualBoard = boardState.map((arr) => [...arr]);

        matrix.forEach((rArr, r) => {
          rArr.forEach((val, c) => {
            if (val === 1) virtualBoard[row + r][col + c] = "temp";
          });
        });

        let rowsWillClear = [];
        let colsWillClear = [];

        for (let r = 0; r < BOARD_SIZE; r++) {
          if (virtualBoard[r].every((cell) => cell !== null)) rowsWillClear.push(r);
        }
        for (let c = 0; c < BOARD_SIZE; c++) {
          let colFull = true;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (virtualBoard[r][c] === null) colFull = false;
          }
          if (colFull) colsWillClear.push(c);
        }

        rowsWillClear.forEach((r) => {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.classList.add("will-clear");
          }
        });
        colsWillClear.forEach((c) => {
          for (let r = 0; r < BOARD_SIZE; r++) {
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (cell && !cell.classList.contains("will-clear")) cell.classList.add("will-clear");
          }
        });
      }

      function clearShadows() {
        document.querySelectorAll(".cell-shadow").forEach((el) => el.classList.remove("cell-shadow"));
        document.querySelectorAll(".will-clear").forEach((el) => el.classList.remove("will-clear"));
      }

      function handlePointerUp(e) {
        document.removeEventListener("pointermove", handlePointerMove);
        document.removeEventListener("pointerup", handlePointerUp);

        if (!draggedData) return;

        const dist = Math.hypot(e.clientX - draggedData.startX, e.clientY - draggedData.startY);

        // FEATURE: Tap to Rotate
        if (dist < 5) {
            rotateShape(draggedData.index);
            // Cleanup without animation
            draggedData.originalElement.classList.remove("shape-hidden");
            draggedData.clone.remove();
            draggedData = null;
            return;
        }

        const adjustY = window.innerWidth < 640 ? draggedData.cellWidth * 2.5 : 0;
        const coords = getGridCoordinates(e.clientX, e.clientY - adjustY);
        clearShadows();

        if (coords.valid && canPlaceShape(draggedData.shapeObj.matrix, coords.row, coords.col)) {
          placeShape(draggedData.shapeObj, coords.row, coords.col);
          currentShapes[draggedData.index] = null;
          document.getElementById(`slot-${draggedData.index}`).innerHTML = "";

          let blocksCount = draggedData.shapeObj.matrix.flat().filter((v) => v === 1).length;
          addScore(blocksCount);

          checkLines();
          generateShapes();
          draggedData.clone.remove();
          draggedData = null;
        } else {
          // Snap-back animation
          const clone = draggedData.clone;
          const original = draggedData.originalElement;
          const slot = original.parentElement;
          const slotRect = slot.getBoundingClientRect();

          clone.style.transition = "all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)";
          const targetLeft = slotRect.left + (slotRect.width - clone.offsetWidth) / 2;
          const targetTop = slotRect.top + (slotRect.height - clone.offsetHeight) / 2;
          const scaleRatio = original.offsetWidth / clone.offsetWidth;

          clone.style.left = `${targetLeft}px`;
          clone.style.top = `${targetTop}px`;
          clone.style.transform = `scale(${scaleRatio})`;

          slot.style.pointerEvents = "none";

          setTimeout(() => {
            original.classList.remove("shape-hidden");
            clone.remove();
            slot.style.pointerEvents = "auto";
            draggedData = null;
          }, 300);
        }
      }

      function canPlaceShape(matrix, row, col) {
        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[0].length; c++) {
            if (matrix[r][c] === 1) {
              let targetRow = row + r;
              let targetCol = col + c;

              if (targetRow < 0 || targetRow >= BOARD_SIZE || targetCol < 0 || targetCol >= BOARD_SIZE) {
                return false;
              }
              if (boardState[targetRow][targetCol] !== null) {
                return false;
              }
            }
          }
        }
        return true;
      }

      function placeShape(shapeObj, row, col) {
        shapeObj.matrix.forEach((rArr, r) => {
          rArr.forEach((val, c) => {
            if (val === 1) {
              let isGem = shapeObj.gems.some((g) => g.r === r && g.c === c);
              boardState[row + r][col + c] = {
                color: shapeObj.color,
                gem: isGem,
              };
            }
          });
        });
        updateBoardVisuals();
      }

      function checkLines() {
        let rowsToClear = [];
        let colsToClear = [];
        let gemsCollectedThisTurn = 0;

        for (let r = 0; r < BOARD_SIZE; r++) {
          if (boardState[r].every((cell) => cell !== null)) rowsToClear.push(r);
        }
        for (let c = 0; c < BOARD_SIZE; c++) {
          let colFull = true;
          for (let r = 0; r < BOARD_SIZE; r++) {
            if (boardState[r][c] === null) colFull = false;
          }
          if (colFull) colsToClear.push(c);
        }

        if (rowsToClear.length > 0 || colsToClear.length > 0) {
          let linesCleared = rowsToClear.length + colsToClear.length;
          let comboPoints = linesCleared * 10 * linesCleared;
          addScore(comboPoints);

          let cellsToClear = new Set();
          rowsToClear.forEach((r) => {
            for (let c = 0; c < BOARD_SIZE; c++) cellsToClear.add(`${r},${c}`);
          });
          colsToClear.forEach((c) => {
            for (let r = 0; r < BOARD_SIZE; r++) cellsToClear.add(`${r},${c}`);
          });

          cellsToClear.forEach((coord) => {
            const [r, c] = coord.split(",").map(Number);
            if (boardState[r][c] && boardState[r][c].gem) {
              gemsCollectedThisTurn++;
            }
            animateAndClear(r, c);
          });

          if (gemsCollectedThisTurn > 0 && currentMode === "collect") {
            collectedGems += gemsCollectedThisTurn;
            updateLevelUI();
          }

          setTimeout(() => {
            updateBoardVisuals();
            checkLevelProgress();
          }, 300);
        } else {
          checkLevelProgress();
        }
      }

      function animateAndClear(r, c) {
        boardState[r][c] = null;
        const cellEl = document.getElementById(`cell-${r}-${c}`);
        if (cellEl && !cellEl.classList.contains("clearing")) {
          cellEl.classList.add("clearing");
          cellEl.style.backgroundColor = "#fff";
          cellEl.innerHTML = "";
          setTimeout(() => {
            cellEl.classList.remove("clearing");
            cellEl.style.backgroundColor = "";
          }, 300);
        }
      }

      // FIXED TEXT COLOR BUG: Using CSS animation instead of direct inline styles
      function addScore(points) {
        score += points;
        scoreEl.innerText = score;
        
        // Remove and re-add class to restart animation ensuring clean visual popup
        scoreEl.classList.remove("score-animate");
        void scoreEl.offsetWidth; // trigger a DOM reflow
        scoreEl.classList.add("score-animate");
      }

      function checkLevelProgress() {
        if (isTransitioningLevel) return;

        let isLevelUp = false;
        if (currentMode === "level" && score >= targetScore) {
          isLevelUp = true;
          targetScore = Math.floor(targetScore * 2.2);
        } else if (currentMode === "collect" && collectedGems >= targetGems) {
          isLevelUp = true;
          targetGems = Math.floor(targetGems * 1.5) + 5;
          collectedGems = 0;
        }

        if (isLevelUp) {
          isTransitioningLevel = true;
          currentLevel++;

          levelUpText.innerText = currentMode === "level" ? `LEVEL ${currentLevel}!` : `ẢI ${currentLevel}!`;
          levelUpBanner.classList.remove("opacity-0", "pointer-events-none");
          levelUpText.classList.remove("scale-50");
          levelUpText.classList.add("scale-100");

          setTimeout(() => {
            boardState = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
            updateBoardVisuals();
            updateLevelUI();

            levelUpBanner.classList.add("opacity-0", "pointer-events-none");
            levelUpText.classList.add("scale-50");
            levelUpText.classList.remove("scale-100");

            isTransitioningLevel = false;

            currentShapes = [null, null, null];
            generateShapes();
          }, 1500);
        }
      }

      function checkGameOverLogic() {
        if (isTransitioningLevel) return;
        if (currentMode === "timed" && timeRemaining <= 0) return;

        let hasValidMove = false;

        for (let i = 0; i < currentShapes.length; i++) {
          const shapeObj = currentShapes[i];
          if (!shapeObj) continue;

          for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
              if (canPlaceShape(shapeObj.matrix, r, c)) {
                hasValidMove = true;
                break;
              }
            }
            if (hasValidMove) break;
          }
          if (hasValidMove) break;
        }

        if (!hasValidMove) {
          triggerGameOver("HẾT NƯỚC ĐI!", "Bạn không còn vị trí nào để đặt khối.");
        }
      }

      function triggerGameOver(title, desc) {
        stopTimer();

        document.getElementById("game-over-title").innerText = title;
        document.getElementById("game-over-desc").innerText = desc;
        document.getElementById("final-score").innerText = score;

        const badge = document.getElementById("high-score-badge");
        const isNewHigh = saveScore(score, currentMode);

        if (isNewHigh) badge.classList.remove("hidden");
        else badge.classList.add("hidden");

        gameOverModal.classList.remove("hidden");
      }
    </script>
  </body>
</html>
